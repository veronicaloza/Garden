<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Fade & Slide Out Test</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 {
            color: white;
            font-size: 2rem;
            animation: fadeSlide 5s ease-out forwards;
        }

        @keyframes fadeSlide {

            /* 0–80% (0–4s): stay fully visible & centered */
            0%,
            80% {
                opacity: 1;
                transform: translateX(0);
            }

            /* 100% (5s): fade to 0 and slide right by 200px */
            100% {
                opacity: 0;
                transform: translateX(200px);
            }
        }
    </style>
</head>

<body>
    <h2>Hello World</h2>
</body>

</html>
